apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-construct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-construct
  template:
    metadata:
      labels:
        app: web-construct
    spec:
      containers:
        - name: web-construct
          image: web-construct:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: web-construct-config
            - secretRef:
                name: web-construct-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
